
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Install project dependencies
        run: npm ci

      - name: Install Capacitor 8
        run: |
          npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Build web app
        run: npm run build

      - name: Create Capacitor config
        run: |
          npx cap init "ZARA ASSISTANT" "com.zara.assistant" --web-dir dist

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZARA-ASSISTANT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
